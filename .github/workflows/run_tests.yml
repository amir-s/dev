name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Lint
        run: deno lint

      - name: Format (check)
        run: deno fmt --check

      - name: Test
        run: deno task test

      - name: Installer tests
        run: bash tests/install.test.sh

      - name: Type check
        run: deno check main.ts
